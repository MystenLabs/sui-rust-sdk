syntax = "proto3";

package sui.rpc.v2;

import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "google/rpc/status.proto";
import "sui/rpc/v2/checkpoint.proto";
import "sui/rpc/v2/epoch.proto";
import "sui/rpc/v2/event.proto";
import "sui/rpc/v2/executed_transaction.proto";
import "sui/rpc/v2/filter.proto";
import "sui/rpc/v2/object.proto";
import "sui/rpc/v2/query_options.proto";

service LedgerService {
  // Query the service for general information about its current state.
  rpc GetServiceInfo(GetServiceInfoRequest) returns (GetServiceInfoResponse);

  rpc GetObject(GetObjectRequest) returns (GetObjectResponse);
  rpc BatchGetObjects(BatchGetObjectsRequest) returns (BatchGetObjectsResponse);

  // List one object's history: its live versions and the versions at which it
  // was deleted or wrapped, in ascending or descending version order, one per
  // response frame, paged by cursor.
  //
  // Servers that prune history, such as fullnodes, list the versions they
  // retain; see `ListObjectVersionsRequest`.
  rpc ListObjectVersions(ListObjectVersionsRequest) returns (stream ListObjectVersionsResponse);

  rpc GetTransaction(GetTransactionRequest) returns (GetTransactionResponse);
  rpc BatchGetTransactions(BatchGetTransactionsRequest) returns (BatchGetTransactionsResponse);

  rpc GetCheckpoint(GetCheckpointRequest) returns (GetCheckpointResponse);

  rpc GetEpoch(GetEpochRequest) returns (GetEpochResponse);

  // List checkpoints matching the provided filters.
  //
  // Checkpoints are returned in ascending or descending checkpoint sequence
  // number order according to the query options ordering.
  // A checkpoint matches if any transaction it contains satisfies the filter.
  rpc ListCheckpoints(ListCheckpointsRequest) returns (stream ListCheckpointsResponse);

  // List transactions matching the provided filters.
  //
  // Transactions are returned in ascending or descending transaction sequence
  // order according to the query options ordering.
  rpc ListTransactions(ListTransactionsRequest) returns (stream ListTransactionsResponse);

  // List events matching the provided filters.
  //
  // Events are returned in ascending or descending packed event sequence order
  // according to the query options ordering.
  rpc ListEvents(ListEventsRequest) returns (stream ListEventsResponse);
}

message GetServiceInfoRequest {}

message GetServiceInfoResponse {
  // The chain identifier of the chain that this node is on.
  //
  // The chain identifier is the digest of the genesis checkpoint, the
  // checkpoint with sequence number 0.
  optional string chain_id = 1;

  // Human-readable name of the chain that this node is on.
  //
  // This is intended to be a human-readable name like `mainnet`, `testnet`, and so on.
  optional string chain = 2;

  // Current epoch of the node based on its highest executed checkpoint.
  optional uint64 epoch = 3;

  // Checkpoint height of the most recently executed checkpoint.
  optional uint64 checkpoint_height = 4;

  // Unix timestamp of the most recently executed checkpoint.
  optional google.protobuf.Timestamp timestamp = 5;

  // The lowest checkpoint for which checkpoints and transaction data are available.
  optional uint64 lowest_available_checkpoint = 6;

  // The lowest checkpoint for which object data is available.
  optional uint64 lowest_available_checkpoint_objects = 7;

  // Software version of the service. Similar to the `server` http header.
  optional string server = 8;
}

message GetObjectRequest {
  // Required. The `ObjectId` of the requested object.
  optional string object_id = 1;

  // Optional. Request a specific version of the object.
  //
  // Mutually exclusive with `max_version`; servers reject a request that sets
  // both with `INVALID_ARGUMENT`. If none of `version`, `max_version` and
  // `at_checkpoint` is set and the object is live, the latest version of the
  // object is returned.
  //
  // Servers that prune history may fail with `NOT_FOUND` for versions that
  // were superseded before their lowest available checkpoint.
  optional uint64 version = 2;

  // Mask specifying which fields to read.
  // If no mask is specified, defaults to `object_id,version,digest`.
  optional google.protobuf.FieldMask read_mask = 3;

  // Optional. Set alone, return the object's state at the end of this
  // checkpoint: a successful response is exact as of `at_checkpoint`, and an
  // object that was deleted or wrapped at or before this checkpoint (and not
  // since unwrapped) is `NOT_FOUND`.
  //
  // Combined with `version` or `max_version`, `at_checkpoint` instead bounds
  // which versions are visible: the server first resolves the version that
  // `version` or `max_version` selects, then fails with `NOT_FOUND` if that
  // version was written in a checkpoint after `at_checkpoint`. `max_version`
  // selects among every version the server has indexed, including versions
  // written after `at_checkpoint` (see `max_version`). The server does not
  // fall back to an older version that was visible at `at_checkpoint`, and it
  // returns a visible version even if the object was deleted or wrapped by
  // the end of `at_checkpoint`. For example, if version 5 was written in
  // checkpoint 10 and version 8 in checkpoint 20, `max_version: 8` with
  // `at_checkpoint: 15` is `NOT_FOUND`, and with `at_checkpoint: 25` returns
  // version 8.
  //
  // Either way, the checkpoint must be at or below the highest checkpoint the
  // server has indexed; larger values fail with `OUT_OF_RANGE` and reason
  // `ABOVE_LATEST_AVAILABLE`, because the server cannot answer for them yet.
  // Servers that prune history may also fail with `OUT_OF_RANGE` and reason
  // `BELOW_EARLIEST_AVAILABLE` for checkpoints below their lowest available
  // one, and servers still backfilling history may fail with `UNAVAILABLE`.
  optional uint64 at_checkpoint = 4;

  // Optional. Return the object's newest version at or below `max_version`.
  //
  // The server selects only among the object's versions at or below its
  // version at the highest checkpoint the server has indexed, so the answer
  // to the same request changes only as the server indexes further.
  //
  // Fails with `NOT_FOUND` if the object has no version at or below
  // `max_version`, or if it was deleted or wrapped at that newest version.
  // With `at_checkpoint`, that newest version must also have been written at
  // or before `at_checkpoint`; see `at_checkpoint`.
  //
  // Mutually exclusive with `version`; servers reject a request that sets
  // both with `INVALID_ARGUMENT`. Servers that prune history may fail with
  // `NOT_FOUND` when the newest version at or below `max_version` was
  // superseded before their lowest available checkpoint.
  optional uint64 max_version = 5;
}

message GetObjectResponse {
  optional Object object = 1;
}

message BatchGetObjectsRequest {
  // The objects to fetch. Each request carries its own `version`,
  // `max_version` or `at_checkpoint`, so a single batch may read different
  // objects at different versions or checkpoints. Errors for individual
  // objects, such as `NOT_FOUND`, are reported per item in the response. A
  // malformed request, such as one that sets both `version` and
  // `max_version`, fails the whole batch with `INVALID_ARGUMENT`.
  repeated GetObjectRequest requests = 1;

  // Mask specifying which fields to read.
  // If no mask is specified, defaults to `object_id,version,digest`.
  optional google.protobuf.FieldMask read_mask = 2;
}

message BatchGetObjectsResponse {
  repeated GetObjectResult objects = 1;
}

message GetObjectResult {
  oneof result {
    Object object = 1;
    google.rpc.Status error = 2;
  }
}

// Request message for LedgerService.ListObjectVersions.
//
// Lists the object's history as items, one per version: a live version
// (`ListObjectVersionsResponse.object`), or a removal
// (`ListObjectVersionsResponse.removal`) at a version where the object was
// deleted or wrapped. Removals count toward `options.limit` like live
// versions, and every bound below applies to them the same way. Items are
// bounded by the intersection of `start_version` and `end_version`,
// `options.after` and `options.before`, and `at_checkpoint` (or, when it is
// unset, the highest checkpoint the server has indexed). When no item falls
// within those bounds, including when the object does not exist, the stream
// delivers no items and ends with `QueryEnd` rather than failing with
// `NOT_FOUND`, except on servers that prune history (see below).
//
// An object's history ends at a `DELETED` removal, because object IDs are
// never reused. After a `WRAPPED` removal the object can be unwrapped at a
// higher version, and the listing continues from there. A transaction that
// unwraps and deletes an object shows as a `DELETED` removal, which can follow
// a `WRAPPED` removal with no live version between them, or be the object's
// only item: an object created already wrapped, then unwrapped and deleted in
// one transaction, never had a live version. An object that has stayed
// wrapped since its creation has no items.
//
// Without `at_checkpoint`, a cursor can name a version above the object's
// version at the highest checkpoint the server has indexed, or name any
// version of an object with no version there. Such a cursor comes from a
// server that has indexed further, for example another replica behind the
// same load balancer. As in the other `List*` RPCs:
//
// - A descending listing with such an `options.after` or `options.before`
//   cursor fails with `OUT_OF_RANGE` and reason `ABOVE_LATEST_AVAILABLE`
//   (`bound` "cursor"), whatever the version range, because listing from
//   this server's view would skip versions below the cursor that it has not
//   indexed. A version cursor records no checkpoint, so the error's
//   `requestedCheckpoint` is its `firstUnavailableCheckpoint`.
// - An ascending listing is served from this server's view: it ends at the
//   object's version at the highest checkpoint the server has indexed with
//   `QUERY_END_REASON_LEDGER_TIP`, unless `end_version`, or a `before`
//   cursor at or below `after`, ends it first, as it would on a server that
//   has caught up. With such an `after` cursor it lists nothing, and the
//   client resumes with that same cursor once the server has caught up.
//
// A server that prunes history may instead fail the request for an object it
// retains nothing of (see below). With `at_checkpoint` set, the listing stops
// at that checkpoint whatever the cursors.
//
// Servers that prune history, such as fullnodes, list the items they retain.
// Such a server keeps object state from the end of one checkpoint on, the
// checkpoint its `BELOW_EARLIEST_AVAILABLE` errors name as
// `lowestAvailableCheckpoint`. Pruning removes an object's live versions and
// removals at or before the end of that checkpoint, including those written
// and superseded within it, except a live version that is the object's state
// at the end of it. Removals written after that checkpoint are retained and
// count as retained versions below, so an object's oldest retained version
// can be a removal. A listing never starts or ends inside pruned history
// without saying so: when the object's older versions were pruned and the
// request's bounds admit versions below its oldest retained version
// (including when neither `start_version` nor `options.after` is set), the
// request fails with `OUT_OF_RANGE` and reason `BELOW_EARLIEST_AVAILABLE`.
// The error's metadata carries `lowestAvailableVersion`, the object's oldest
// retained version, as well as `lowestAvailableCheckpoint`.
//
// - Ascending, the request fails before streaming anything. Setting
//   `start_version` to `lowestAvailableVersion` lists the retained items.
// - Descending, the stream delivers every retained item within the
//   request's bounds and then, unless it reached `options.limit` first,
//   fails with that error instead of ending with `QueryEnd`.
//
// An object created after `lowestAvailableCheckpoint` usually keeps its whole
// history. An object that was wrapped at or before that checkpoint and
// unwrapped after it has lost its earlier history, including that `WRAPPED`
// removal: its oldest retained version is the version it was unwrapped at (a
// `DELETED` removal if the same transaction deleted it), and the rule above
// applies there. The server cannot always tell an unwrap from a creation,
// because the effects that would show it may be pruned, and when it cannot
// it applies the rule anyway. So the server may refuse versions below an
// object's oldest retained version even for an object created after that
// checkpoint.
//
// On a server that has pruned history, a request for an object it retains no
// item of, neither a live version nor a removal, fails with `OUT_OF_RANGE`
// and reason `BELOW_EARLIEST_AVAILABLE`, with only
// `lowestAvailableCheckpoint` in its metadata, rather than listing no items.
// Such an object was deleted, or wrapped and not since unwrapped, at or
// before that checkpoint, or never existed, and the server cannot tell which.
// This error takes precedence over the `ABOVE_LATEST_AVAILABLE` error for a
// cursor, but not over the errors for `at_checkpoint`.
//
// Servers that do not offer this method fail with `UNIMPLEMENTED`; for
// example, kv-rpc without object-at-checkpoint indexing, which fails its
// `GetObject` reads with `at_checkpoint` or `max_version` the same way.
// Fullnodes fail with `UNAVAILABLE` when they run without RPC indexes, run
// the objects compactor, or are still restoring history.
message ListObjectVersionsRequest {
  // Required. The `ObjectId` of the object whose versions to list.
  optional string object_id = 1;

  // Mask specifying which fields of each live version's `object` to read.
  // If no mask is specified, defaults to `object_id,version,digest`. It does
  // not apply to `removal`, which always carries all of its fields that the
  // server has.
  optional google.protobuf.FieldMask read_mask = 2;

  // Optional. Cursor-bounded paging.
  //
  // This listing's order is ascending version.
  //
  // - `limit`: the maximum number of items, live versions and removals, to
  //   stream. Defaults to `50` when unset; the maximum is `1000`, and larger
  //   values are coerced to `1000` (and `0` to `1`).
  // - `after` / `before`: exclusive bounds in this listing's order, taken
  //   from `ListObjectVersionsResponse.cursor` in earlier streams. Their
  //   meaning does not depend on `ordering`. Either or both may be set, and
  //   they intersect with `start_version`, `end_version`, and
  //   `at_checkpoint`. A malformed cursor, or one for another object, fails
  //   with `INVALID_ARGUMENT`.
  // - `ordering`: `ORDERING_ASCENDING` (the default) returns items in this
  //   listing's order, and `ORDERING_DESCENDING` in reverse.
  //
  // Responses carry no `Watermark`: resume from the `cursor` of the last
  // item received, and read the stream's `QueryEnd` to tell whether items
  // remain (see `ListObjectVersionsResponse`). To page backward from the
  // items already received, request `ORDERING_DESCENDING` with `before` set
  // to the `cursor` of the first item in this listing's order.
  optional QueryOptions options = 3;

  // Optional. Start of the version range to list (inclusive). Intersects with
  // every other bound.
  optional uint64 start_version = 4;

  // Optional. End of the version range to list (exclusive). Intersects with
  // every other bound.
  optional uint64 end_version = 5;

  // Optional. List only the versions, live or removed, written at or before
  // this checkpoint. Intersects with every other bound.
  //
  // If unset, the server lists only the versions written at or before the
  // highest checkpoint it has indexed, so that paging never skips a version
  // that was still being indexed when a later version was listed.
  //
  // The checkpoint must be at or below the highest checkpoint the server has
  // indexed; larger values fail with `OUT_OF_RANGE` and reason
  // `ABOVE_LATEST_AVAILABLE`, because the server cannot answer for them yet.
  // Servers that prune history may also fail with `OUT_OF_RANGE` and reason
  // `BELOW_EARLIEST_AVAILABLE` for checkpoints below their lowest available
  // one, and servers still backfilling history may fail with `UNAVAILABLE`.
  optional uint64 at_checkpoint = 6;
}

// Response message for LedgerService.ListObjectVersions.
//
// A frame that delivers an item sets exactly one of `object`, for a live
// version, and `removal`, for a version at which the object was deleted or
// wrapped, and carries that item's `cursor`. Items come in this listing's
// order (ascending version), or in reverse when `options.ordering` is
// `ORDERING_DESCENDING`. Frames carry no `Watermark`: a version listing has
// no filter, so there is no scan progress to report.
//
// `end` is set exactly once, on the final frame of a successful stream, with
// one of these reasons:
//
// - `QUERY_END_REASON_ITEM_LIMIT`: the stream delivered the coerced
//   `options.limit` items. The frame that delivers the last of them, a live
//   version or a removal, carries `end`, even when no further items remain.
// - `QUERY_END_REASON_CURSOR_BOUND`: the listing reached `options.before`
//   (ascending) or `options.after` (descending).
// - `QUERY_END_REASON_CHECKPOINT_BOUND`: the listing reached the edge of the
//   window the request set: `end_version` or the object's newest version at
//   `at_checkpoint` (ascending), or `start_version` or the object's first
//   version (descending).
// - `QUERY_END_REASON_LEDGER_TIP`: an ascending listing with `at_checkpoint`
//   unset reached the object's newest version at the highest checkpoint the
//   server has indexed, or started past it from an `options.after` cursor,
//   before reaching `end_version` or `options.before`. Versions written later
//   may extend the listing, unless its last item is a `DELETED` removal.
//
// For every reason other than `QUERY_END_REASON_ITEM_LIMIT`, the final frame
// has no `object`, `removal` or `cursor`.
//
// To continue in the same direction, keep the request's other fields and pass
// the `cursor` of the last item received as `options.after` (ascending) or
// `options.before` (descending). After `QUERY_END_REASON_ITEM_LIMIT` that
// reads the next page, and after `QUERY_END_REASON_LEDGER_TIP` it lists
// versions written since. `QUERY_END_REASON_CURSOR_BOUND` and
// `QUERY_END_REASON_CHECKPOINT_BOUND` mean no item within the request's
// bounds remains in that direction.
//
// A stream that fails or is cancelled terminates with a gRPC status and does
// not send `QueryEnd`.
message ListObjectVersionsResponse {
  // One live version of the object, with the fields selected by
  // `ListObjectVersionsRequest.read_mask`.
  optional Object object = 1;

  // The opaque position of this frame's item in the listing, for use as
  // `ListObjectVersionsRequest.options.after` or `options.before`. Set on
  // every frame that carries `object` or `removal`.
  optional bytes cursor = 2;

  // Set exactly once, on the final frame of a successful stream.
  optional QueryEnd end = 3;

  // A version at which the object was deleted or wrapped.
  optional ObjectRemoval removal = 4;
}

// A version at which an object was deleted or wrapped, listed by
// `ListObjectVersions`. The object has no contents at this version:
// `GetObject` for this `version`, or with a `max_version` whose newest version
// at or below it is this one, fails with `NOT_FOUND`.
message ObjectRemoval {
  // How the object was removed.
  enum Kind {
    KIND_UNKNOWN = 0;

    // The object was deleted. Object IDs are never reused, so this is the
    // object's last version. A transaction that unwraps and deletes an object
    // also shows as `DELETED`.
    DELETED = 1;

    // The object was wrapped in another object. It can later be unwrapped at
    // a higher version.
    WRAPPED = 2;
  }

  // The version the transaction that removed the object assigned it.
  optional uint64 version = 1;

  // How the object was removed.
  optional Kind kind = 2;

  // The digest of the transaction that deleted or wrapped the object. Unset
  // when the server does not have it, for example a fullnode after pruning,
  // or kv-rpc for removals indexed before it recorded their transactions.
  optional string transaction = 3;
}

message GetTransactionRequest {
  // Required. The digest of the requested transaction.
  optional string digest = 1;

  // Mask specifying which fields to read.
  // If no mask is specified, defaults to `digest`.
  optional google.protobuf.FieldMask read_mask = 2;
}

message GetTransactionResponse {
  optional ExecutedTransaction transaction = 1;
}

message BatchGetTransactionsRequest {
  // Required. The digests of the requested transactions.
  repeated string digests = 1;

  // Mask specifying which fields to read.
  // If no mask is specified, defaults to `digest`.
  optional google.protobuf.FieldMask read_mask = 2;
}

message BatchGetTransactionsResponse {
  repeated GetTransactionResult transactions = 1;
}

message GetTransactionResult {
  oneof result {
    ExecutedTransaction transaction = 1;
    google.rpc.Status error = 2;
  }
}

message GetCheckpointRequest {
  // If neither is provided, return the latest
  oneof checkpoint_id {
    // The sequence number of the requested checkpoint.
    uint64 sequence_number = 1;

    // The digest of the requested checkpoint.
    string digest = 2;
  }

  // Mask specifying which fields to read.
  // If no mask is specified, defaults to `sequence_number,digest`.
  optional google.protobuf.FieldMask read_mask = 3;
}

message GetCheckpointResponse {
  optional Checkpoint checkpoint = 1;
}

message GetEpochRequest {
  // The requested epoch.
  // If no epoch is provided the current epoch will be returned.
  optional uint64 epoch = 1;

  // Mask specifying which fields to read.
  // If no mask is specified, defaults to `epoch`.
  optional google.protobuf.FieldMask read_mask = 2;
}

message GetEpochResponse {
  optional Epoch epoch = 1;
}

// Request message for LedgerService.ListCheckpoints.
message ListCheckpointsRequest {
  // Optional. Mask for specifying which parts of the Checkpoint should be
  // returned (e.g. summary, contents, signatures).
  optional google.protobuf.FieldMask read_mask = 1;

  // Optional. Start of the checkpoint range to query (inclusive). Defaults to
  // genesis.
  optional uint64 start_checkpoint = 2;

  // Optional. End of the checkpoint range to query (exclusive). Defaults to the
  // current indexed ledger tip.
  optional uint64 end_checkpoint = 3;

  // Optional. DNF filter over indexed transaction dimensions. A checkpoint
  // matches if any transaction it contains satisfies the filter. If absent,
  // all checkpoints in the range are returned.
  optional TransactionFilter filter = 4;

  // Optional cursor-bounded query options. If unspecified, reads in ascending
  // order with the default item limit. The server enforces a maximum item
  // limit and silently coerces larger values down to it. To paginate, pass
  // the last received `Watermark.cursor` as `options.after` (ascending) or
  // `options.before` (descending) on the next request.
  optional QueryOptions options = 5;
}

// Response message for LedgerService.ListCheckpoints.
//
// Every frame carries a `watermark` with a safe resume cursor. A frame
// with `checkpoint` set delivers one matching item; a frame without it reports
// scan progress or terminal completion. Watermarks never regress in the
// requested ordering but may repeat.
//
// `end` is set exactly once, on the final frame of a successful stream. For
// `QUERY_END_REASON_ITEM_LIMIT`, that frame also carries the final item. For
// every other end reason, the final frame has no `checkpoint` payload.
message ListCheckpointsResponse {
  // One matching checkpoint.
  optional Checkpoint checkpoint = 1;

  // Progress watermark as of this frame. Present on every frame. A
  // ScanLimit terminal watermark may repeat the previous frame's cursor when
  // its authoritative scan frontier was already emitted.
  optional Watermark watermark = 2;

  // Set exactly once, on the final frame of a successful query stream.
  optional QueryEnd end = 3;
}

// Request message for LedgerService.ListTransactions.
message ListTransactionsRequest {
  // Optional. Mask for specifying which parts of the ExecutedTransaction
  // should be returned.
  optional google.protobuf.FieldMask read_mask = 1;

  // Optional. Start of the checkpoint range to query (inclusive). Defaults to
  // genesis.
  optional uint64 start_checkpoint = 2;

  // Optional. End of the checkpoint range to query (exclusive). Defaults to the
  // current indexed ledger tip.
  optional uint64 end_checkpoint = 3;

  // Optional. DNF filter over indexed dimensions.
  // If absent, all transactions in the range are returned.
  optional TransactionFilter filter = 4;

  // Optional cursor-bounded query options. If unspecified, reads in ascending
  // order with the default item limit. The server enforces a maximum item
  // limit and silently coerces larger values down to it. To paginate, pass
  // the last received `Watermark.cursor` as `options.after` (ascending) or
  // `options.before` (descending) on the next request.
  optional QueryOptions options = 5;

  // Optional. Transaction position within `start_checkpoint` at which the
  // query starts (inclusive): within `start_checkpoint`, only transactions
  // whose `ExecutedTransaction.transaction_index` is at least this value are
  // returned. Unset starts at the beginning of `start_checkpoint`. An index at
  // or past the checkpoint's transaction count starts at the next checkpoint.
  // Requires `start_checkpoint`. When this position leaves transactions of
  // `start_checkpoint` out, a descending query does not report that checkpoint
  // as covered in `Watermark.checkpoint`.
  //
  // Combines with `options.after` by intersection: the query starts at
  // whichever of the two is later in ledger order.
  //
  // Servers that predate this field ignore it and start at the beginning of
  // `start_checkpoint`, so clients must still drop transactions before this
  // position themselves.
  optional uint64 start_transaction_index = 6;

  // Optional. Transaction position within the last checkpoint of the range,
  // `end_checkpoint - 1`, at which the query ends (exclusive): within that
  // checkpoint, only transactions whose `ExecutedTransaction.transaction_index`
  // is below this value are returned, so 0 returns none of it. Unset ends after
  // the whole checkpoint. An index at or past the checkpoint's transaction
  // count ends after the whole checkpoint. Requires `end_checkpoint`. A query
  // that stops at this position ends with `QUERY_END_REASON_CHECKPOINT_BOUND`.
  // When this position leaves transactions of that checkpoint out, an
  // ascending query does not report it as covered in `Watermark.checkpoint`.
  //
  // Combines with `options.before` by intersection: the query ends at
  // whichever of the two is earlier in ledger order.
  //
  // Servers that predate this field ignore it and return the whole
  // checkpoint, so clients must still drop transactions at or after this
  // position themselves.
  optional uint64 end_transaction_index = 7;
}

// Response message for LedgerService.ListTransactions.
//
// Every frame carries a `watermark` with a safe resume cursor. A frame
// with `transaction` set delivers one matching item; a frame without it reports
// scan progress or terminal completion. Watermarks never regress in the
// requested ordering but may repeat.
//
// `end` is set exactly once, on the final frame of a successful stream. For
// `QUERY_END_REASON_ITEM_LIMIT`, that frame also carries the final item. For
// every other end reason, the final frame has no `transaction` payload.
message ListTransactionsResponse {
  // One matching transaction. Its position within the containing checkpoint
  // is reported by `ExecutedTransaction.transaction_index`.
  optional ExecutedTransaction transaction = 1;

  // Progress watermark as of this frame. Present on every frame. A
  // ScanLimit terminal watermark may repeat the previous frame's cursor when
  // its authoritative scan frontier was already emitted.
  optional Watermark watermark = 2;

  // Set exactly once, on the final frame of a successful query stream.
  optional QueryEnd end = 3;
}

// Request message for LedgerService.ListEvents.
message ListEventsRequest {
  // Optional. Mask for specifying which parts of the Event should be returned.
  optional google.protobuf.FieldMask read_mask = 1;

  // Optional. Start of the checkpoint range to query (inclusive). Defaults to
  // genesis.
  optional uint64 start_checkpoint = 2;

  // Optional. End of the checkpoint range to query (exclusive). Defaults to the
  // current indexed ledger tip.
  optional uint64 end_checkpoint = 3;

  // Optional. DNF filter over indexed dimensions.
  // If absent, all events in the range are returned.
  optional EventFilter filter = 4;

  // Optional cursor-bounded query options. If unspecified, reads in ascending
  // order with the default item limit. The server enforces a maximum item
  // limit and silently coerces larger values down to it. To paginate, pass
  // the last received `Watermark.cursor` as `options.after` (ascending) or
  // `options.before` (descending) on the next request.
  optional QueryOptions options = 5;

  // Optional. Transaction position within `start_checkpoint` at which the
  // query starts (inclusive): within `start_checkpoint`, only events of
  // transactions whose `Event.transaction_index` is at least this value are
  // returned. Unset starts at the beginning of `start_checkpoint`. An index at
  // or past the checkpoint's transaction count starts at the next checkpoint,
  // ignoring `start_event_index`. Requires `start_checkpoint`. When this
  // position leaves events of `start_checkpoint` out, a descending query does
  // not report that checkpoint as covered in `Watermark.checkpoint`.
  //
  // Combines with `options.after` by intersection: the query starts at
  // whichever of the two is later in ledger order.
  //
  // Servers that predate this field ignore it and start at the beginning of
  // `start_checkpoint`, so clients must still drop events before this
  // position themselves.
  optional uint64 start_transaction_index = 6;

  // Optional. Event position within the transaction at
  // `start_transaction_index` at which the query starts (inclusive): within
  // that transaction, only events whose `Event.event_index` is at least this
  // value are returned. Unset starts at the transaction's first event. An
  // index past the transaction's last event starts at the next transaction.
  // Requires `start_transaction_index`.
  //
  // Servers that predate this field ignore it, as for
  // `start_transaction_index`.
  optional uint32 start_event_index = 7;

  // Optional. Transaction position within the last checkpoint of the range,
  // `end_checkpoint - 1`, at which the query ends (exclusive): within that
  // checkpoint, only events of transactions whose `Event.transaction_index` is
  // below this value are returned, plus, with `end_event_index`, the events
  // of the transaction at this index that precede it. Unset ends after the
  // whole checkpoint. An index at or past the checkpoint's transaction count
  // ends after the whole checkpoint. Requires `end_checkpoint`. A query that
  // stops at this position ends with `QUERY_END_REASON_CHECKPOINT_BOUND`.
  // When this position leaves events of that checkpoint out, an ascending
  // query does not report it as covered in `Watermark.checkpoint`.
  //
  // Combines with `options.before` by intersection: the query ends at
  // whichever of the two is earlier in ledger order.
  //
  // Servers that predate this field ignore it and return the whole
  // checkpoint, so clients must still drop events at or after this position
  // themselves.
  optional uint64 end_transaction_index = 8;

  // Optional. Event position within the transaction at
  // `end_transaction_index` at which the query ends (exclusive): events of
  // that transaction whose `Event.event_index` is below this value are also
  // returned. Unset, like 0, returns none of the transaction's events. An
  // index past the transaction's last event returns all of them. Requires
  // `end_transaction_index`.
  //
  // Servers that predate this field ignore it, as for
  // `end_transaction_index`.
  optional uint32 end_event_index = 9;
}

// Response message for LedgerService.ListEvents.
//
// Every frame carries a `watermark` with a safe resume cursor. A frame
// with `event` set delivers one matching item; a frame without it reports scan
// progress or terminal completion. Watermarks never regress in the requested
// ordering but may repeat.
//
// `end` is set exactly once, on the final frame of a successful stream. For
// `QUERY_END_REASON_ITEM_LIMIT`, that frame also carries the final item. For
// every other end reason, the final frame has no `event` payload.
message ListEventsResponse {
  // One matching event. Its ledger position -- containing checkpoint,
  // emitting transaction digest and offset, and index within that
  // transaction's event list -- is reported by the corresponding fields on
  // `Event`.
  optional Event event = 1;

  // Progress watermark as of this frame. Present on every frame. A
  // ScanLimit terminal watermark may repeat the previous frame's cursor when
  // its authoritative scan frontier was already emitted.
  optional Watermark watermark = 2;

  // Set exactly once, on the final frame of a successful query stream.
  optional QueryEnd end = 3;
}
